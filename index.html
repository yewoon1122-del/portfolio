<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무제</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--bg:#fcfcfc;--fg:#111;--mute:#8f8f8f;--line:#e6e6e6;--card:#f0f0f0;--glass:rgba(252,252,252,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#ededed;--mute:#7c7c7c;--line:#242424;--card:#161616;--glass:rgba(10,10,10,.72)}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#ededed;--mute:#7c7c7c;--line:#242424;--card:#161616;--glass:rgba(10,10,10,.72)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:400 13px/1.65 'Inter','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none;text-align:left}
.mono,.no,.ct,.tab,.cnt,.note,.tag,.dock button{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px}
#app{max-width:1100px;margin:0 auto;padding:0 20px 140px;animation:f .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes f{from{opacity:0;transform:translateY(6px);filter:blur(4px)}}
/* home */
.intro{max-width:520px;padding-top:18vh}
.intro p{font-size:15px;line-height:1.55;font-weight:500;letter-spacing:-.01em}
.intro p span{color:var(--mute)}
.list{max-width:520px;margin-top:44px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);transition:padding .25s}
.row:hover{padding-left:8px}
.row .no,.row .ct{color:var(--mute)}
.links{display:flex;gap:20px;margin-top:28px;max-width:520px}
.links button,.links a{color:var(--mute)}
.links button:hover,.links a:hover{color:var(--fg)}
.mantra{max-width:520px;margin-top:72px;color:var(--mute)}
.mantra b{color:var(--fg);font-weight:400}
.pv{position:fixed;left:0;top:0;width:190px;aspect-ratio:4/5;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s;background:var(--card);overflow:hidden}
.pv.on{opacity:1}
.pv img{width:100%;height:100%;object-fit:cover}
/* sections */
.bar{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0 56px}
.ttl{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px}
.ttl h1{font-size:13px;font-weight:500}
.ttl .no,.ttl .ct{color:var(--mute)}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font:400 10px 'IBM Plex Mono',monospace;color:var(--mute);background:var(--card);padding:8px}
.tabs{display:flex;gap:18px;overflow-x:auto;margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:var(--mute);padding-bottom:3px;border-bottom:1px solid transparent}
.tab.on{color:var(--fg);border-color:var(--fg)}
.grid{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.g4{grid-template-columns:repeat(4,1fr)}.narrow{max-width:640px}.bn{grid-template-columns:repeat(3,1fr)}}
.ar-th{aspect-ratio:3/4}.ar-ig{aspect-ratio:1080/1350}.ar-bn{aspect-ratio:15/8}
.card{background:var(--card);overflow:hidden;position:relative;width:100%;display:block}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font:400 10px 'IBM Plex Mono',monospace;color:var(--mute);padding:6px 0 14px}
h2{font-size:13px;font-weight:500;margin:56px 0 4px}
.note{color:var(--mute);margin-bottom:14px}
.one{grid-template-columns:1fr}
@media(min-width:900px){.one{grid-template-columns:repeat(3,1fr)}}
.slides{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{color:var(--mute);margin-bottom:4px}
.cnt{color:var(--mute);margin-top:10px}
.badge{position:absolute;top:8px;left:8px;font:400 9px 'IBM Plex Mono',monospace;background:var(--fg);color:var(--bg);padding:2px 7px;z-index:1}
.resume{display:grid;gap:36px;max-width:620px}
.resume h3{font:400 11px 'IBM Plex Mono',monospace;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.resume li{list-style:none;display:grid;grid-template-columns:110px 1fr;gap:12px;padding:5px 0}
.resume li span:first-child{color:var(--mute)}
/* stage */
:root{--stage:#ececec;--slide:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#0d0d0d;--slide:#1a1a1a}}
:root[data-theme="dark"]{--stage:#0d0d0d;--slide:#1a1a1a}
body.home{overflow:hidden;background:var(--stage)}
.stage{position:relative;left:50%;width:100vw;margin-left:-50vw;height:100svh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
@media(hover:hover){.stage{cursor:grab}.stage:active{cursor:grabbing}}
.it{--w:min(74vw,50svh);--r:1.25;position:absolute;left:50%;top:50%;width:var(--w);will-change:transform}
.it .card{height:calc(var(--w)*var(--r));background:var(--slide);cursor:inherit}
.it .card .ph,.it .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it img{-webkit-user-drag:none;pointer-events:none}
.sl{position:absolute;left:0;bottom:calc(100% + 8px);font:400 11px 'Inter',sans-serif;color:var(--mute);white-space:nowrap}
.card.intro{background:#fff;color:#151515}
.dot{position:absolute;right:0;top:0;height:100%;aspect-ratio:1;border-radius:50%;background:#ff0;transform:translate(calc(var(--mx,0)*16px),calc(var(--my,0)*16px));transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.big{position:absolute;left:5.4%;top:6%;font-size:calc(var(--w)*.072);line-height:1.04;font-weight:500;letter-spacing:-.035em}
.big span{display:block}
.tl,.tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:200}
.tl{left:20px}.tr{right:20px;margin:0}
/* ruler nav */
.ruler{position:absolute;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;width:min(300px,52vw);transform:translateX(-50%);height:30px;z-index:200;touch-action:none;cursor:ew-resize}
.tk{position:absolute;top:50%;width:3px;height:3px;border-radius:50%;background:var(--mute);opacity:.6;transform:translate(-50%,-50%)}
.tk.mj{background:var(--fg);opacity:1}
.rn{position:absolute;top:calc(100% + 4px);transform:translateX(-50%);font:400 9px 'IBM Plex Mono',monospace;color:var(--mute)}
.rt{position:absolute;top:calc(100% + 22px);transform:translateX(-50%);font:400 10px 'Inter','Noto Sans KR',sans-serif;font-style:normal;white-space:nowrap;background:var(--fg);color:var(--bg);padding:2px 8px;opacity:0;pointer-events:none;transition:opacity .15s}
.rt.on{opacity:1}
.rc{position:absolute;left:0;top:50%;width:30px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:99px;background:var(--stage,var(--bg));color:var(--fg)}
.rc svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 0 40px;background:var(--bg)}
.rbar .ruler{position:relative;top:auto;left:auto;transform:none;margin:0 auto}
.rbar .rc{background:var(--bg)}
.plus{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:150;pointer-events:none;opacity:.55}
.plus:before,.plus:after{content:"";position:absolute;background:var(--fg)}
.plus:before{left:10px;top:0;width:1px;height:22px}.plus:after{top:10px;left:0;height:1px;width:22px}
.cur{position:absolute;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);z-index:200;pointer-events:none;font-weight:500}
.hint{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);z-index:200;pointer-events:none;color:var(--mute)}
@media(max-width:700px){.it{--w:min(76vw,52svh)}.big{font-size:calc(var(--w)*.094)}.hint,.plus{display:none}}
.sw{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:pointer}
.sw::-webkit-scrollbar{display:none}
.sw>div{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:start}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;pointer-events:none;z-index:2}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--fg);opacity:.25;transition:opacity .2s}
.dots i.on{opacity:.9}
.coll{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.it .card .coll img,.it .card .coll .ph{position:static;width:100%;height:100%;min-width:0;min-height:0}
@media(max-width:700px){.coll>*:nth-child(3){display:none}}
.nat{align-items:start}.nat .card{height:auto}.nat .card img{height:auto;object-fit:contain}.nat .ph{min-height:240px}
/* dock */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:10;display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.08)}
.dock button{min-width:34px;height:30px;padding:0 10px;border-radius:99px;color:var(--mute);text-align:center;transition:background .2s,color .2s}
.dock button:hover{color:var(--fg)}
.dock button.on{background:var(--fg);color:var(--bg)}
.lb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px 60px}
.lb.on{display:block;animation:f .35s both}
.lb .x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);right:20px;z-index:41;font:400 11px 'IBM Plex Mono',monospace}
.lb .in{max-width:720px;margin:0 auto}
.lb img{width:100%;display:block}
.lb .ph{min-height:140vh}
/* bottom ruler dock */
.dock{z-index:30;padding:10px 22px 24px;gap:0}
.dock .ruler{position:relative;top:auto;left:auto;transform:none;margin:0;width:min(300px,64vw)}
.dock .rt{top:auto;bottom:calc(100% + 18px)}
.rc{background:var(--bg)}
.tl,.tr{top:calc(env(safe-area-inset-top,0px) + 22px)}
@media(max-width:700px){.cur{bottom:calc(env(safe-area-inset-bottom,0px) + 108px)}}
/* compact top dock */
.dock{top:calc(env(safe-area-inset-top,0px) + 14px);bottom:auto;padding:5px 20px}
.dock .ruler{height:24px}
.rc{height:22px}
.rc svg{width:17px;height:17px}
.rn{display:none}
.dock .rt{top:calc(100% + 14px);bottom:auto}
.bar{padding:62px 0 28px}
@media(max-width:700px){.cur{bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}}
/* names bigger, captions */
.sl{font-size:16px;font-weight:500;bottom:calc(100% + 10px)}
.ttl{grid-template-columns:1fr auto}.ttl h1{font-size:20px}
.cur{font-size:15px}
.lb{padding-bottom:150px}
.lbcap{position:fixed;left:0;right:0;bottom:0;z-index:41;display:none;padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.lbcap>*{max-width:720px;margin:0 auto}
.lbcap b{display:block;font-weight:500;font-size:14px}
.lbcap p{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.65}
/* centered detail page, name inside image */
.narrow{margin-left:auto;margin-right:auto}
.ctr .tabs{justify-content:safe center}
.ctr h2,.ctr .note{text-align:center}
.sl{left:50%;top:calc(50% + 26px);bottom:auto;transform:translateX(-50%);z-index:2;color:#fff;font-size:11px;font-weight:400;text-shadow:0 1px 10px rgba(0,0,0,.4);pointer-events:none}
@media(min-width:900px){.bn3{grid-template-columns:repeat(3,1fr)}}
/* product detail (built inside this site) */
.lb .in:has(.pd){max-width:860px}
.pd{text-align:left;font-size:14px;line-height:1.7}
.pd img{width:100%;height:auto;display:block}
.pd-imgs{margin-bottom:56px}
.pd-sec{margin:0 0 56px}
.pd-lab{font:400 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--mute);margin-bottom:10px}
.pd h3{font-size:24px;font-weight:500;letter-spacing:-.03em;margin:0 0 18px}
.pd h3+.pd-lab{margin-top:-10px;margin-bottom:14px}
.pd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.pd-grid>div{background:var(--bg);padding:14px 16px}
.pd-grid small{display:block;font:400 10px 'IBM Plex Mono',monospace;color:var(--mute);letter-spacing:.12em}
.pd-grid b{font-weight:500;font-size:15px}
.pd-row{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.pd-row:last-child{border-bottom:1px solid var(--line)}
.pd-row span:first-child{font-weight:500}
.pd-tb{width:100%;border-collapse:collapse;text-align:center;border-top:1px solid var(--fg)}
.pd-tb th,.pd-tb td{padding:10px 6px;border-bottom:1px solid var(--line);font-weight:400}
.pd-tb th{color:var(--mute);font-size:12px}
.pd-note{font-size:11px;color:var(--mute);text-align:right;margin-top:8px}
.pd ul{list-style:none}
.pd li{position:relative;padding-left:14px;font-size:13px;color:var(--mute);margin-bottom:6px}
.pd li:before{content:"";position:absolute;left:0;top:.8em;width:3px;height:3px;border-radius:50%;background:var(--mute)}
.pd-miss{padding:28px 12px;text-align:center;font:400 11px 'IBM Plex Mono',monospace;color:var(--mute);background:var(--card);margin-bottom:2px;word-break:break-all}
/* product: swipe thumbnails on top */
.pd-swrap{position:relative;width:100%;margin:0 0 48px}
.pd-sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:5/6;cursor:pointer}
.pd-sw::-webkit-scrollbar{display:none}
.pd-sw>div{flex:0 0 100%;position:relative;scroll-snap-align:start;background:var(--card)}
.pd-sw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pd-sw .pd-miss{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0}
.pd-dots{bottom:12px}
.pd-imgs.gen:empty:before{content:"이미지 준비 중";display:block;padding:60px 0;text-align:center;font:400 11px 'IBM Plex Mono',monospace;color:var(--mute)}
.pd-dots{gap:6px}
.pd-dots i{width:5px;height:5px;background:#fff;opacity:.45}
.pd-dots i.on{opacity:1}
.pd-dots.bk i{background:#000}
.sw,.pd-sw{cursor:grab}
.sw:active,.pd-sw:active{cursor:grabbing}
.sw img,.pd-sw img{-webkit-user-drag:none;user-select:none}

.dc:empty{display:none}
.vgrid{grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.vgrid{grid-template-columns:repeat(3,1fr)}}
.vid{padding:0;border:0;cursor:pointer;background:#000}
.vid video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vid .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vid .play svg{width:44px;height:44px;fill:#fff;padding:12px;background:rgba(0,0,0,.45);border-radius:50%;backdrop-filter:blur(6px)}
.blk{margin-top:40px}
.wsw{position:relative;width:100%;background:var(--card);overflow:hidden}
.wsw-in{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:pointer;align-items:flex-start}
.wsw-in::-webkit-scrollbar{display:none}
.wsw-in>div{flex:0 0 100%;scroll-snap-align:start}
.wsw-in img{width:100%;height:auto;display:block;-webkit-user-drag:none;user-select:none}
.desc{max-width:640px;margin:18px 0 0}
.desc h3{font-size:13px;font-weight:500;margin-bottom:8px}
.desc p{font-size:13px;line-height:1.75;color:var(--mute);margin-bottom:10px;word-break:keep-all}
.lb video{background:#000}
</style>
</head>
<body>
<main id="app"></main>
<div class="pv" id="pv"></div>
<nav class="dock" id="dock"></nav>
<div class="lb" id="lb"><button class="x" onclick="closeLb()" aria-label="닫기">CLOSE</button><div class="in" id="lbin"></div><div class="lbcap" id="lbcap"></div></div>

<script>
/* ===== 여기만 수정하면 됩니다 =====
   src에 이미지 경로/URL을 넣으면 자동 교체. 비워두면 자리표시자가 보입니다. */
const PROFILE={
  name:'예원',
  intro:['예원은 이커머스와 크리에이티브 프로덕션을 하는 디자이너입니다.','패션 캠페인, 룩북, 프론트엔드 커스텀, AI 비주얼을 만듭니다.'],
  hero:['예원은','이커머스와','크리에이티브','프로덕션을 하는','디자이너입니다.'],
  links:[{label:'Email',copy:'your@email.com'},{label:'Instagram',href:'https://instagram.com/yourid'}],
  mantra:['보기 좋게.','정확하게.','끝까지.','만든다.'],
  resume:[
    {title:'ABOUT',rows:[['소개','여기에 한 줄 소개를 입력하세요.']]},
    {title:'EXPERIENCE',rows:[['20XX–현재','회사명 / 직무'],['20XX–20XX','회사명 / 직무']]},
    {title:'EDUCATION',rows:[['20XX','학교 / 전공']]},
    {title:'SKILLS',rows:[['Design','Photoshop, Illustrator, Figma'],['Dev','HTML, CSS, JS'],['AI','이미지·영상 생성 툴']]},
    {title:'CONTACT',rows:[['Email','your@email.com'],['Instagram','@yourid']]}
  ]
};
const CATS=['남성 캐쥬얼','여성 캐쥬얼','여성 가방','스노우','워크웨어','스포츠'];
const mk=(n,f)=>Array.from({length:n},(_,i)=>f(i));
const n2=n=>String(n).padStart(2,'0'),I=p=>'images/'+p;
const KEYS=['men','women','bag','snow','workwear','sports'];
const NM={'men-1':'코듀로이 플리스 후드 집업','men-2':'웨이브 롱슬리브','women-1':'우먼스 셔닐 후드 집업','women-2':'우먼스 크라운 후드 롱슬리브'};
const L=(dir,files,label)=>files.map((f,i)=>({src:I(dir+'/'+f),label:label+' '+n2(i+1)}));
const BD=[{"t": "01.gif", "d": "01_detail.jpg"}, {"t": "02.gif", "d": "02_detail.jpg"}, {"t": "03.jpg", "d": "03_detail.jpg"}, {"t": "04.gif", "d": "04_detail.jpg"}, {"t": "05.jpg", "d": "05_detail.jpg"}, {"t": "06.jpg", "d": "06_detail.jpg"}, {"t": "07.jpg", "d": "07_detail.jpg"}, {"t": "08.jpg", "d": "08_detail.jpg"}, {"t": "09.jpg", "d": "09_detail.jpg"}];
const DATA={
  detail:CATS.map((c,ci)=>({name:c,items:mk(2,i=>{const NN='0'+(i+1),k=KEYS[ci]+'-'+(i+1),b=`detail/${KEYS[ci]}/detail/${NN}/`;return {thumb:I(b+'S_0.jpg'),detail:I(b),nn:NN,label:NM[k]||(c+' '+(i+1))}}),retouch:mk(2,i=>{const b=`detail/${KEYS[ci]}/swipe/0${i+1}_`;return {after:I(b+'a.jpg'),before:I(b+'b.jpg'),label:c+' '+(i+1)}})})),
  bannerDetail:BD.map((b,i)=>({src:I('banner/detail/'+b.t),detail:I('banner/detail/'+b.d),label:'Banner '+n2(i+1)})),
  bannerPlain:L('banner/none',["01.jpg", "02.jpg", "03.jpg", "04.jpg", "05.jpg", "06.jpg", "07.jpg", "08.jpg", "09.jpg", "10.gif", "11.jpg", "12.jpg"],'Banner'),
  bannerSeries:L('banner/series',["01.jpg", "02.jpg", "03.jpg"],'Series'),
  pop:L('pop',["01.jpg", "02.jpg"],'POP')

function dragScroll(el){

  const end=e=>{if(!d)return;const dx=e.clientX-d.x,w=el.clientWidth||1,i=Math.round(d.l/w);let t=Math.round(el.scrollLeft/w);if(Math.abs(dx)>w*.12)t=dx<0?i+1:i-1;t=Math.max(0,Math.min(el.children.length-1,t));d=null;el.style.scrollSnapType='';el.scrollTo({left:t*w,behavior:'smooth'})};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);

  try{
    const Rc=(sw.clientWidth/sw.clientHeight)||5/6,Ri=img.naturalWidth/img.naturalHeight,vw=Ri>Rc?Rc/Ri:1,vh=Ri>Rc?1:Ri/Rc;

    const c=document.createElement('canvas');c.width=16;c.height=6;const x=c.getContext('2d');x.drawImage(img,sx,sy,sWd,sHt,0,0,16,6);
    const px=x.getImageData(0,0,16,6).data;let t=0;for(let k=0;k<px.length;k+=4)t+=.2126*px[k]+.7152*px[k+1]+.0722*px[k+2];

  ${SECTIONS.map((x,i)=>`<div class="it" data-i="${i}"><div class="sl">${x.label}</div><div class="card">${collage(x)}</div></div>`).join('')}
  <div class="cur mono" id="cur"></div><div class="hint mono">scroll · drag · Z</div></div>`},
  detail(){const cat=DATA.detail[tab];return `${head('detail')}<div class="ctr">
  <div class="tabs">${DATA.detail.map((c,i)=>`<button class="tab ${i===tab?'on':''}" onclick="setTab(${i})">${c.name}</button>`).join('')}</div>
  <div class="grid narrow">${cat.items.map((o,j)=>`<div><button class="card ar-th" onclick="OPEN('d',${tab},${j})">${im(o.thumb,o.label)}</button><p class="cap">${o.label}</p></div>`).join('')}</div>
  <h2>원본 + 보정본</h2><p class="note">swipe →</p>
  <div class="grid narrow">${cat.retouch.map(r=>`<div class="card ar-th"><div class="sw"><div>${im(r.after,r.label+' 보정본')}</div><div>${im(r.before,r.label+' 원본')}</div></div><span class="dots"><i class="on"></i><i></i></span></div>`).join('')}</div></div>`},
  banner(){const g=(arr,fn)=>`<div class="grid bn3 nat">${arr.map(fn).join('')}</div>`,pl=b=>`<button class="card" onclick="OPENS('${b.src}','${b.label}')">${im(b.src,b.label)}</button>`;
  return `${head('banner')}
  <h2 style="margin-top:0">시리즈</h2><p class="note">${n2(DATA.bannerSeries.length)}</p>
  ${g(DATA.bannerSeries,pl)}
  <h2>상세 없음</h2><p class="note">${n2(DATA.bannerPlain.length)}</p>
  ${g(DATA.bannerPlain,pl)}
  <h2>상세 있음</h2><p class="note">${n2(DATA.bannerDetail.length)}</p>
  ${g(DATA.bannerDetail,(b,i)=>`<button class="card" onclick="OPEN('b',${i})"><span class="badge">DETAIL</span>${im(b.src,b.label)}</button>`)}
  ${bannerBottom()}`},
  insta(){return head('insta')+dynGrid('instagram',30,'ar-ig')+`<section class="blk">${wsw(['instagram/swipe/1|instagram/swipe/01','instagram/swipe/2|instagram/swipe/02'])}${descHTML('insta')}</section>`},
  pop(){return head('pop')+`<div class="grid narrow nat">${DATA.pop.map(o=>`<button class="card" onclick="OPENS('${o.src}','${o.label}')">${im(o.src,o.label)}</button>`).join('')}</div>`},
  ai(){return head('ai')+`<h2 style="margin-top:0">26FW</h2>`+dynGrid('ai/26FW',24,'ar-th')+`<h2>26SS</h2>`+dynGrid('ai/26SS',24,'ar-th')+`<h2>Video</h2>`+videoGrid('ai/video',6)},
  resume(){return `${head('resume')}<div class="resume">${PROFILE.resume.map(s=>`<section><h3>${s.title}</h3><ul>${s.rows.map(r=>`<li><span>${r[0]}</span><span>${r[1]}</span></li>`).join('')}</ul></section>`).join('')}</div>`}
};
const NAMES=SECTIONS.map(x=>x.label),NS=NAMES.length,T=(NS-1)*2+1,RW=30;
const rulerHTML=()=>`<div class="ruler" id="ruler" aria-label="section nav">${Array.from({length:T},(_,k)=>`<i class="tk${k%2?'':' mj'}" style="left:calc(15px + (100% - 30px) * ${k/(T-1)})"></i>`).join('')}${NAMES.map((_,i)=>`<span class="rn" style="left:calc(15px + (100% - 30px) * ${i/(NS-1)})">${SECTIONS[i].n}</span>`).join('')}<em class="rt"></em><i class="rc"><svg viewBox="0 0 24 24"><path d="M8.5 3 3 6l2 4 2.5-1.2V20h9V8.8L19 10l2-4-5.5-3c-.6 1.6-2 2.5-3.5 2.5S9.1 4.6 8.5 3Z"/></svg></i></div>`;
const ICONS=["<path d=\"M8.5 3 3 6l2 4 2.5-1.2V20h9V8.8L19 10l2-4-5.5-3c-.6 1.6-2 2.5-3.5 2.5S9.1 4.6 8.5 3Z\"/>", "<rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1.5\"/><path d=\"M9 20h6M12 16v4\"/><path d=\"M12 6.8l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9z\"/>", "<rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><circle cx=\"17\" cy=\"7\" r=\".6\"/>", "<rect x=\"7\" y=\"2.5\" width=\"10\" height=\"19\" rx=\"2\"/><path d=\"M10.5 18.5h3\"/>", "<path d=\"M6 2.5h8.5L19 7v14.5H6z\"/><path d=\"M14 2.5V7.5h5\"/><circle cx=\"12.5\" cy=\"11.5\" r=\"2\"/><path d=\"M9 18c.5-2 2-3 3.5-3s3 1 3.5 3\"/>"];
function paintRuler(rul,p){
  const c=rul._c||(rul._c={rc:rul.querySelector('.rc'),tk:[...rul.querySelectorAll('.tk')]});
  const W=rul.clientWidth,x=RW/2+p/(NS-1)*(W-RW);
  const ic=Math.round(p);if(c.ic!==ic){c.ic=ic;c.rc.innerHTML=`<svg viewBox="0 0 24 24">${ICONS[ic]}</svg>`}
  c.rc.style.transform=`translate(${x-RW/2}px,-50%)`;
  c.tk.forEach((t,k)=>{const d=RW/2+k/(T-1)*(W-RW)-x;t.style.width=t.style.height=((k%2?3:4.5)+5*Math.exp(-d*d/1600))+'px'});
}
const nearest=(rul,e)=>{const r=rul.getBoundingClientRect();return Math.round(Math.max(0,Math.min(1,(e.clientX-r.left-15)/(r.width-30)))*(NS-1))};
function rulerHover(rul){
  const rt=rul.querySelector('.rt');
  rul.addEventListener('pointermove',e=>{const i=nearest(rul,e);rt.textContent=NAMES[i];rt.style.left=`calc(15px + (100% - 30px) * ${i/(NS-1)})`;rt.classList.add('on')});
  rul.addEventListener('pointerleave',()=>rt.classList.remove('on'));
}
function setupRuler(k){
  const rul=$('#ruler');if(!rul)return;
  paintRuler(rul,SECTIONS.findIndex(x=>x.id===k));
  rul.onpointerdown=rul.onpointermove=rul.onpointerup=null;
  rul.onclick=e=>{const i=nearest(rul,e);go(SECTIONS[i].id)};
}
window.__idx=0;
function initStage(){
  const st=$('#stage'),its=[...st.querySelectorAll('.it')],N=its.length,cur=$('#cur'),rul=$('#ruler');
  let pos=window.__idx,tgt=pos,ov=false,z=1,shr=1,prev=pos,drag=null,moved=false,downIt=null,vel=0,lp=0,lt=0,wt,shown=-1,scr=false;
  const GAP=36,clamp=v=>Math.max(0,Math.min(N-1,v)),sp=()=>its[0].offsetWidth+GAP,zOv=()=>Math.min(1,innerWidth*.88/(N*sp()));
  function setOv(on){if(on===ov)return;ov=on;if(on){window.__idx=Math.round(clamp(pos));tgt=(N-1)/2}else tgt=Math.round(clamp(window.__idx))}
  function paint(){
    const w=sp(),sc=z*shr;
    its.forEach((el,i)=>{el.style.transform=`translate(-50%,-50%) translateX(${(i-pos)*w*sc}px) scale(${sc})`});
    paintRuler(rul,clamp(pos));
    const c=Math.round(clamp(pos));
    if(c!==shown){shown=c;cur.innerHTML=SECTIONS[c].label}
  }
  (function tick(){
    if(!document.body.contains(st))return;
    if(!drag){const df=tgt-pos;pos=Math.abs(df)<.0005?tgt:pos+df*.14}
    z+=((ov?zOv():1)-z)*.14;
    const v=pos-prev;prev=pos;
    const ends=Math.max(0,Math.min(pos,N-1-pos)),base=1-.25*Math.min(ends,1);
    const goal=base*(1-Math.min(Math.abs(v)*6,.25));
    shr+=(goal-shr)*.12;
    paint();requestAnimationFrame(tick)
  })();
  rul.onclick=null;
  st.addEventListener('pointerdown',e=>{
    if(ov){downIt=e.target.closest('.it');drag=null;moved=false;return}
    drag={x:e.clientX,p:pos};moved=false;vel=0;lp=pos;lt=performance.now();downIt=e.target.closest('.it');st.setPointerCapture(e.pointerId)
  });
  st.addEventListener('pointermove',e=>{
    st.style.setProperty('--mx',(e.clientX/innerWidth-.5)*2);st.style.setProperty('--my',(e.clientY/innerHeight-.5)*2);
    if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>6)moved=true;
    const raw=drag.p-dx/sp();
    pos=raw<0?raw*.35:raw>N-1?N-1+(raw-(N-1))*.35:raw;
    const now=performance.now(),dt=now-lt;if(dt>0){vel=.8*vel+.2*((pos-lp)/dt);lp=pos;lt=now}
  });
  const up=()=>{
    const was=drag;drag=null;
    if(was&&moved){tgt=Math.round(clamp(pos+vel*220));return}
    if(downIt){const i=+downIt.dataset.i;
      if(ov){window.__idx=i;setOv(false)}
      else if(i===Math.round(clamp(pos)))go(SECTIONS[i].id)
      else tgt=i}
    downIt=null
  };
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  const scrub=e=>{const r=rul.getBoundingClientRect();ov=false;tgt=Math.max(0,Math.min(1,(e.clientX-r.left-15)/(r.width-30)))*(N-1)};
  rul.onpointerdown=e=>{scr=true;rul.setPointerCapture(e.pointerId);scrub(e)};
  rul.onpointermove=e=>{if(scr)scrub(e)};
  rul.onpointerup=()=>{scr=false;tgt=Math.round(tgt)};
  st.addEventListener('wheel',e=>{
    e.preventDefault();
    if(e.ctrlKey){setOv(e.deltaY>0);return}
    if(ov)return;
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    tgt=clamp(tgt+d/(sp()*.45));clearTimeout(wt);wt=setTimeout(()=>{tgt=Math.round(tgt)},150)
  },{passive:false});
  document.addEventListener('keydown',function k(e){
    if(!document.body.contains(st)){document.removeEventListener('keydown',k);return}
    const c=Math.round(clamp(tgt));
    if(e.key==='ArrowRight'&&!ov)tgt=clamp(c+1);
    if(e.key==='ArrowLeft'&&!ov)tgt=clamp(c-1);
    if(e.key==='Enter'&&!ov)go(SECTIONS[c].id);
    if(e.key==='z'||e.key==='Z')setOv(!ov);
    if(e.key==='Escape')setOv(false)
  });
}
window.setTab=i=>go('detail/'+i);
$('#dock').innerHTML=rulerHTML();rulerHover($('#dock .ruler'));
function render(){
  const [h,sub]=location.hash.slice(1).split('/'),k=V[h]?h:'home';
  if(k==='detail')tab=Math.max(0,Math.min(CATS.length-1,+sub||0));
  if(k!=='home')window.__idx=SECTIONS.findIndex(x=>x.id===k);
  app.style.animation='none';app.offsetHeight;app.style.animation='';
  app.innerHTML=V[k]();PV('',0);
  document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('on',b.dataset.k===(k==='home'?'':k)));
  document.body.classList.toggle('home',k==='home');
  scrollTo(0,0);
  if(k==='home')initStage();else setupRuler(k);
  bindWsw();
  document.querySelectorAll('.sw').forEach(sw=>{
    dragScroll(sw);
    const dots=sw.parentNode.querySelectorAll('.dots i');
    sw.addEventListener('scroll',()=>{const i=Math.round(sw.scrollLeft/sw.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',j===i))},{passive:true});
    sw.addEventListener('click',()=>{const i=Math.round(sw.scrollLeft/sw.clientWidth);sw.scrollTo({left:(i?0:1)*sw.clientWidth,behavior:'smooth'})})
  });
}
window.addEventListener('hashchange',render);
render();
</script>
